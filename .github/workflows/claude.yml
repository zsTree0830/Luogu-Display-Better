name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    timeout-minutes: 180
    if: |
      (
        (github.event_name == 'issue_comment' && 
         contains(github.event.comment.body, '@claude') &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
        ) ||
        (github.event_name == 'pull_request_review_comment' && 
         contains(github.event.comment.body, '@claude') &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
        ) ||
        (github.event_name == 'pull_request_review' && 
         contains(github.event.review.body, '@claude') &&
         (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'COLLABORATOR')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: |
            The user mentioned @claude in a comment on PR #${{ github.event.issue.number || github.event.pull_request.number }}.
            Their comment was: "${{ github.event.comment.body || github.event.review.body }}"
            
            Understand their intent (e.g., "fix", "修复", "review", "explain") and act accordingly.
            - Only modify files that are part of this pull request (use `gh pr diff` to see changes).
            - If asked to fix issues, make the necessary changes and commit them with a descriptive message.
            - For other requests, reply in the PR thread with a clear, helpful response in Simplified Chinese.
          claude_args: |
            --model ${{ vars.DEEPSEEK_MODEL }} --effort ${{ vars.DEEPSEEK_EFFORT }} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*)"
