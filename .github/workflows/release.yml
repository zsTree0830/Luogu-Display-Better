name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT

      - name: Update version in script
        run: |
          VERSION=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LuoguDisplayBetter.user.js
          git commit -m "chore: bump version to ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: "Luogu Display Better ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            LuoguDisplayBetter.user.js
          prerelease: ${{ steps.version.outputs.patch != '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
